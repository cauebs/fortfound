name = "fortfound_app"
version = "1.0.0"
description = "Clean room reimplementation of Zachtronics' Fortune's Foundation solitaire game."
target = "javascript"
licences = ["AGPL-3.0-or-later"]
repository = { type = "github", user = "cauebs", repo = "fortfound" }
links = [{ title = "Home page", href = "https://cauebs.github.io/fortfound" }]
dev-dependencies = { lustre_dev_tools = ">= 1.7.0 and < 2.0.0" }

[dependencies]
gleam_stdlib = ">= 0.59.0 and < 1.0.0"
lustre = ">= 5.0.1 and < 6.0.0"
modem = ">= 2.0.2 and < 3.0.0"
fortfound_core = { path = "../fortfound_core" }
glector = ">= 1.1.0 and < 2.0.0"
# lustre_animation = { git = "https://github.com/cauebs/lustre_animation", ref = "main" }
lustre_animation = { path = "../lustre_animation"}
gleam_community_maths = ">= 2.0.0 and < 3.0.0"
